[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_b3"
version = "0.1.0"
description = "Análise quantitativa de ações da B3: retorno, risco, carteiras e backtest."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
